spring.application.name=school-app-server
server.port=${SERVER_PORT:8081}

# ===================================================================
# DATABASE: the app connects as a LOGIN member of schoolcrm_app (row-level security applies);
# Flyway runs as the owner. Never point SPRING_DATASOURCE_USERNAME at the owner.
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:schoolcrm_api}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:api}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${FLYWAY_USER:postgres}
spring.flyway.password=${FLYWAY_PASSWORD:postgres}
# Flyway's history table lives in platform; V1 creates every other schema
spring.flyway.schemas=platform
spring.flyway.default-schema=platform

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================================================
# AUTH: tokens are issued by school-auth; validated against its JWKS
# ===================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URL:http://localhost:8080}
app.auth.base-url=${AUTH_BASE_URL:${spring.security.oauth2.resourceserver.jwt.issuer-uri}}

# Nightly directory refresh from school-auth (/internal/v1, client_credentials, scope directory.read)
app.directory-sync.enabled=${DIRECTORY_SYNC_ENABLED:false}
app.directory-sync.client-id=${DIRECTORY_SYNC_CLIENT_ID:school-app-server}
app.directory-sync.client-secret=${DIRECTORY_SYNC_CLIENT_SECRET:}
app.directory-sync.cron=${DIRECTORY_SYNC_CRON:0 30 1 * * *}
app.directory-sync.zone=${DIRECTORY_SYNC_ZONE:Asia/Kolkata}

# ===================================================================
# API docs: generated per actor from openapi/*.yaml (also served raw at /openapi/<actor>.yaml)
# ===================================================================
spring.web.resources.static-locations=classpath:/static/
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
# One Swagger UI group per actor module
springdoc.group-configs[0].group=common
springdoc.group-configs[0].paths-to-match=/api/v1/common/**
springdoc.group-configs[1].group=admin
springdoc.group-configs[1].paths-to-match=/api/v1/admin/**
