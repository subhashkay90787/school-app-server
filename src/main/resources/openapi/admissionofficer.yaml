components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdmissionDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - OFFERED
          - WAITLISTED
          - REJECTED
        note:
          type: string
      required:
      - decision
    AdmissionsApplication:
      type: object
      description: Table admissions.application (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        applicationId:
          type: integer
          format: int64
          readOnly: true
        enquiryId:
          type: integer
          format: int64
          description: -> admissions.enquiry
        academicYearId:
          type: integer
          format: int64
          description: -> academics.academic_year
        programId:
          type: integer
          format: int64
          description: -> academics.program
        applicationNumber:
          type: string
        formData:
          type: object
          additionalProperties: true
        residencyRequested:
          type: string
          enum:
          - DAY_SCHOLAR
          - HOSTELLER
        transportRequested:
          type: boolean
        quota:
          type: string
          enum:
          - GENERAL
          - RTE
          - MANAGEMENT
          - STAFF_WARD
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - UNDER_REVIEW
          - ASSESSMENT
          - OFFERED
          - WAITLISTED
          - REJECTED
          - ACCEPTED
          - ENROLLED
          - WITHDRAWN
        applicationFeeId:
          type: integer
          format: int64
          description: -> finance.fee
        applicantUserId:
          type: integer
          format: int64
          description: Auth user id
        decidedByUserId:
          type: integer
          format: int64
          description: Auth user id
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        studentId:
          type: integer
          format: int64
          description: -> academics.student
      required:
      - applicationId
      - applicationNumber
      - status
    AdmissionsApplicationInput:
      type: object
      description: Create/update body for admissions.application
      properties:
        enquiryId:
          type: integer
          format: int64
          description: -> admissions.enquiry
        academicYearId:
          type: integer
          format: int64
          description: -> academics.academic_year
        programId:
          type: integer
          format: int64
          description: -> academics.program
        formData:
          type: object
          additionalProperties: true
        residencyRequested:
          type: string
          enum:
          - DAY_SCHOLAR
