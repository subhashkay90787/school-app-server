components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ApprovalItem:
      type: object
      properties:
        flowInstanceId:
          type: integer
          format: int64
        kind:
          type: string
        refId:
          type: integer
          format: int64
        title:
          type: string
        requestedBy:
          $ref: '#/components/schemas/PersonRef'
        amount:
          type: number
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        dueBy:
          type: string
          format: date-time
        urgency:
          type: string
          enum:
          - SAFETY
          - MONEY
          - OTHER
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PolicyCheck'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
        status:
          type: string
          enum:
          - OPEN
          - APPROVED
          - REJECTED
          - CANCELLED
          - SENT_BACK
        waitingFor:
          type: string
        aboveYourBand:
          type: boolean
        forwardedTo:
          type: string
      description: Approvals inbox card (UX v2 4.1); your own requests never appear here
    ApprovalStep:
      type: object
      properties:
        sequence:
          type: integer
          format: int32
        approverRoleCode:
          type: string
        approverName:
          type: string
        decision:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SENT_BACK
        note:
          type: string
        decidedAt:
          type: string
          format: date-time
    AssetAssignInput:
      type: object
      properties:
        assignedLocationId:
          type: integer
          format: int64
        assignedUserId:
          type: integer
          format: int64
        assignedStudentId:
          type: integer
          format: int64
    AssetItem:
      type: object
      description: Table inventory.asset_item (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        assetId:
          type: integer
          format: int64
          readOnly: true
        itemCatalogId:
          type: integer
          format: int64
          description: -> inventory.item_catalog
        barcodeId:
          type: string
