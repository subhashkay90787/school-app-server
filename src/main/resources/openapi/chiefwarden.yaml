components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Allocation:
      type: object
      description: Table hostel.allocation (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        allocationId:
          type: integer
          format: int64
          readOnly: true
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        bedId:
          type: integer
          format: int64
          description: -> hostel.bed
        roomId:
          type: integer
          format: int64
          description: -> hostel.room
        hostelId:
          type: integer
          format: int64
          description: -> hostel.hostel
        academicYearId:
          type: integer
          format: int64
          description: -> academics.academic_year
        feePlanId:
          type: integer
          format: int64
          description: -> hostel.fee_plan
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - VACATED
          - TRANSFERRED
          - SUSPENDED
        isRoomLeader:
          type: boolean
        allocatedByUserId:
          type: integer
          format: int64
          description: Auth user id
        requestId:
          type: integer
          format: int64
          description: -> hostel.allocation_request
      required:
      - allocationId
      - studentId
      - bedId
      - roomId
      - hostelId
      - checkInDate
      - status
    AllocationBoard:
      type: object
      properties:
        hostelId:
          type: integer
          format: int64
        floor:
          type: integer
          format: int32
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomCell'
        waitlist:
          type: array
          items:
            $ref: '#/components/schemas/AllocationRequest'
    AllocationCreate:
      type: object
      properties:
        studentId:
          type: integer
          format: int64
        bedId:
          type: integer
          format: int64
        checkInDate:
          type: string
          format: date
        feePlanId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
      description: One active bed per student and per bed
      required:
      - studentId
      - bedId
      - checkInDate
    AllocationRequest:
      type: object
      description: Table hostel.allocation_request (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        requestId:
          type: integer
          format: int64
          readOnly: true
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        academicYearId:
          type: integer
          format: int64
          description: -> academics.academic_year
        kind:
          type: string
          enum:
          - NEW
          - ROOM_CHANGE
          - VACATE
        preferredHostelId:
          type: integer
          format: int64
          description: -> hostel.hostel
        preferredRoomType:
          type: string
        roommatePrefStudentId:
          type: integer
          format: int64
          description: -> academics.student
        reason:
          type: string
        status:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - WAITLISTED
          - REJECTED
          - DONE
        requestedByUserId:
          type: integer
          format: int64
          description: Auth user id
        decidedByUserId:
          type: integer
          format: int64
          description: Auth user id
      required:
      - requestId
      - studentId
      - kind
      - status
    AllocationRequestPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllocationRequest'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    Bed:
      type: object
      description: Table hostel.bed (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        bedId:
          type: integer
          format: int64
          readOnly: true
        roomId:
          type: integer
          format: int64
          description: -> hostel.room
        bedLabel:
          type: string
        status:
          type: string
          enum:
          - VACANT
          - OCCUPIED
          - BLOCKED
          - MAINTENANCE
      required:
      - bedId
      - roomId
      - bedLabel
      - status
    BedCell:
      type: object
      properties:
        bedId:
          type: integer
          format: int64
        label:
          type: string
        status:
          type: string
