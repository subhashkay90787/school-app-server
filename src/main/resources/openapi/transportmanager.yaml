      x-base-roles:
      - TRANSPORT_MANAGER
      x-operation-extra-annotation: '@com.school.app.core.access.Access(feature = "TRANSPORT")'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ComplianceItem:
      type: object
      properties:
        vehicleId:
          type: integer
          format: int64
        registrationNumber:
          type: string
        kind:
          type: string
          enum:
          - INSURANCE
          - FITNESS
          - PERMIT
          - PUC
          - DRIVING_LICENCE
        validTill:
          type: string
          format: date
        daysLeft:
          type: integer
          format: int32
    FuelLog:
      type: object
      description: Table transport.fuel_log (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        fuelLogId:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          description: -> transport.vehicle
        filledOn:
          type: string
          format: date
        litres:
          type: number
        amount:
          type: number
        odometerKm:
          type: integer
          format: int32
        expenseId:
          type: integer
          format: int64
          description: -> accounts.expense
      required:
      - fuelLogId
      - vehicleId
      - filledOn
    FuelLogInput:
      type: object
      description: Create/update body for transport.fuel_log
      properties:
        vehicleId:
          type: integer
          format: int64
          description: -> transport.vehicle
        filledOn:
          type: string
          format: date
        litres:
          type: number
        amount:
          type: number
        odometerKm:
          type: integer
          format: int32
      required:
      - vehicleId
      - filledOn
    FuelLogPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FuelLog'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    HomeCard:
      type: object
      properties:
        id:
          type: string
        section:
          type: string
          enum:
          - CRITICAL
          - NEEDS_YOU
          - NOW
          - TODAY
          - FEED
        kind:
          type: string
        title:
          type: string
        subtitle:
          type: string
        count:
          type: integer
          format: int32
        severity:
          type: string
          enum:
          - INFO
          - ACTION
          - URGENT
          - CRITICAL
        dueAt:
          type: string
          format: date-time
        roleTag:
          type: string
        deepLink:
          type: string
        payload:
          type: object
          additionalProperties: true
      description: One home card; cards with nothing in them are not returned
      required:
      - id
      - section
      - kind
      - title
    HomeFeed:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        role:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/HomeCard'
        allCaughtUp:
          type: boolean
        nextScheduled:
          $ref: '#/components/schemas/HomeCard'
      description: 'Home in card order: Critical -> Needs you -> Now -> Today -> Feed (UX v2 section 3)'
    LiveTrip:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        route:
          type: string
        driver:
          $ref: '#/components/schemas/PersonRef'
        status:
          type: string
        lat:
          type: number
        lng:
          type: number
        onTime:
          type: boolean
        stoppedMinutes:
          type: integer
          format: int32
        lastUpdateAt:
          type: string
          format: date-time
    MaskedCallLog:
      type: object
      properties:
        callId:
          type: string
        tripId:
          type: integer
          format: int64
        driver:
          $ref: '#/components/schemas/PersonRef'
        student:
          $ref: '#/components/schemas/PersonRef'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int32
    MaskedCallLogPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaskedCallLog'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PersonRef:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        name:
          type: string
        photoUrl:
          type: string
        label:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code, e.g. FEATURE_OFF, CONSENT_REQUIRED, DUES_HOLD
    Route:
      type: object
      description: Table transport.route (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        routeId:
          type: integer
          format: int64
          readOnly: true
        code:
          type: string
        name:
          type: string
        shift:
          type: string
          enum:
          - MORNING
          - AFTERNOON
          - BOTH
        vehicleId:
          type: integer
          format: int64
          description: -> transport.vehicle
        driverUserId:
          type: integer
          format: int64
          description: Auth user id
        attendantUserId:
          type: integer
          format: int64
          description: Auth user id
      required:
      - routeId
      - code
      - name
    RouteInput:
      type: object
      description: Create/update body for transport.route
      properties:
        code:
          type: string
        name:
          type: string
        shift:
          type: string
          enum:
          - MORNING
          - AFTERNOON
          - BOTH
        vehicleId:
          type: integer
          format: int64
          description: -> transport.vehicle
        driverUserId:
          type: integer
          format: int64
          description: Auth user id
        attendantUserId:
          type: integer
          format: int64
          description: Auth user id
      required:
      - code
      - name
    Stop:
      type: object
      description: Table transport.stop (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        stopId:
          type: integer
          format: int64
          readOnly: true
        routeId:
          type: integer
          format: int64
          description: -> transport.route
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        sequence:
          type: integer
          format: int32
        pickupTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: 08:30
        dropTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: 08:30
        feeStructureId:
          type: integer
          format: int64
          description: -> finance.fee_structure
      required:
      - stopId
      - routeId
      - name
    StopInput:
      type: object
      properties:
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        sequence:
          type: integer
          format: int32
        pickupTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: 08:30
        dropTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
          example: 08:30
        feeStructureId:
          type: integer
          format: int64
      required:
      - name
      - sequence
    StopsInput:
      type: object
      properties:
        stops:
          type: array
          items:
            $ref: '#/components/schemas/StopInput'
      required:
      - stops
    StudentRoute:
      type: object
      description: Table transport.student_route (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        routeId:
          type: integer
          format: int64
          description: -> transport.route
        pickupStopId:
          type: integer
          format: int64
          description: -> transport.stop
        dropStopId:
          type: integer
          format: int64
          description: -> transport.stop
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - ENDED
      required:
      - studentId
      - routeId
      - fromDate
      - status
    StudentRouteInput:
      type: object
      description: Create/update body for transport.student_route
      properties:
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        routeId:
          type: integer
          format: int64
          description: -> transport.route
        pickupStopId:
          type: integer
          format: int64
          description: -> transport.stop
        dropStopId:
          type: integer
          format: int64
          description: -> transport.stop
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
      required:
      - studentId
      - routeId
      - fromDate
    Trip:
      type: object
      description: Table transport.trip (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        tripId:
          type: integer
          format: int64
          readOnly: true
        routeId:
          type: integer
          format: int64
          description: -> transport.route
        vehicleId:
          type: integer
          format: int64
          description: -> transport.vehicle
        driverUserId:
          type: integer
          format: int64
          description: Auth user id
        rosterEntryId:
          type: integer
          format: int64
          description: -> hr.roster_entry
        tripDate:
          type: string
          format: date
        direction:
          type: string
          enum:
          - PICKUP
          - DROP
          - HOSTEL_STATION_DROP
        groupId:
          type: integer
          format: int64
          description: -> hostel.outing_group
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PLANNED
          - RUNNING
          - COMPLETED
          - CANCELLED
      required:
      - tripId
      - routeId
      - tripDate
      - direction
      - status
    TripLocation:
      type: object
      description: Table transport.trip_location (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        tripId:
          type: integer
          format: int64
          description: -> transport.trip
        recordedAt:
          type: string
          format: date-time
        lat:
          type: number
        lng:
          type: number
        speedKmph:
          type: number
      required:
      - tripId
      - recordedAt
      - lat
      - lng
    TripPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    Vehicle:
      type: object
      description: Table transport.vehicle (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        registrationNumber:
          type: string
        vehicleType:
          type: string
          enum:
          - BUS
          - VAN
          - CAR
        capacity:
          type: integer
          format: int32
        gpsDeviceId:
          type: string
        insuranceValidTill:
          type: string
          format: date
        fitnessValidTill:
          type: string
          format: date
        permitValidTill:
          type: string
          format: date
        pucValidTill:
          type: string
          format: date
        assetId:
          type: integer
          format: int64
          description: -> inventory.asset_item
        status:
          type: string
          enum:
          - ACTIVE
          - IN_REPAIR
          - RETIRED
      required:
      - vehicleId
      - registrationNumber
      - status
    VehicleInput:
      type: object
      description: Create/update body for transport.vehicle
      properties:
        registrationNumber:
          type: string
        vehicleType:
          type: string
          enum:
          - BUS
          - VAN
          - CAR
        capacity:
          type: integer
          format: int32
        gpsDeviceId:
          type: string
        insuranceValidTill:
          type: string
          format: date
        fitnessValidTill:
          type: string
          format: date
        permitValidTill:
          type: string
          format: date
        pucValidTill:
          type: string
          format: date
        assetId:
          type: integer
          format: int64
          description: -> inventory.asset_item
      required:
      - registrationNumber
