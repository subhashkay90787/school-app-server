          - MEDICAL
          - ON_DUTY
        late:
          type: boolean
      required:
      - studentId
    ArrivalCheckIn:
      type: object
      properties:
        studentIds:
          type: array
          items:
            type: integer
            format: int64
        arrivedAt:
          type: string
          format: date-time
        note:
          type: string
      required:
      - studentIds
    BehaviorNoteInput:
      type: object
      properties:
        studentId:
          type: integer
          format: int64
        category:
          type: string
          enum:
          - POSITIVE
          - CONCERN
          - WELFARE
