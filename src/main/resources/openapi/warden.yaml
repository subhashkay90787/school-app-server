components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CriticalAlert:
      type: object
      properties:
        notificationId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        student:
          $ref: '#/components/schemas/PersonRef'
        raisedAt:
          type: string
          format: date-time
        ladder:
          type: array
          items:
            $ref: '#/components/schemas/EscalationStep'
    CustodyEventInput:
      type: object
      properties:
        eventType:
          type: string
          enum:
          - DEPOSIT
          - RELEASE
          - RETURN
          - MOVE_UNIT
          - CONFISCATE
          - HANDOVER_PARENT
          - INSPECT
          - MARK_LOST
          - MARK_DAMAGED
          - CLOSE
        releaseReason:
          type: string
          enum:
          - TRAVEL_HOME
          - OUTING
          - CALL_HOUR
          - ONLINE_EXAM
          - MEDICAL
          - PARENT_COLLECT
          - LEAVING_SCHOOL
        outingId:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
        windowId:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        toUnitId:
          type: integer
          format: int64
        counterpartyKind:
          type: string
          enum:
          - STUDENT
          - PARENT
          - PICKUP_PERSON
        counterpartyUserId:
          type: integer
          format: int64
        counterpartyPickupPersonId:
          type: integer
          format: int64
        verification:
          type: string
          enum:
          - QR
          - STUDENT_OTP
          - PARENT_OTP
          - SIGNATURE
          - FACE
        conditionNote:
          type: string
        photoUrl:
          type: string
      description: Release only after gate OUT / in a call-hour window; confiscation needs an incident (enforced by the database)
      required:
      - eventType
    EmergencyApproval:
      type: object
      properties:
        confirmedByUserId:
          type: integer
          format: int64
        confirmedByName:
          type: string
        callAt:
          type: string
          format: date-time
        note:
          type: string
      description: Night warden's provisional approval, recording who confirmed by phone
      required:
      - callAt
    EscalationStep:
      type: object
      properties:
        step:
          type: integer
          format: int32
        label:
          type: string
        person:
          $ref: '#/components/schemas/PersonRef'
        notifiedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
    HandoverDraft:
      type: object
      properties:
        openItems:
          type: array
          items:
            type: string
        sickStudents:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        lateReturns:
          type: array
          items:
            $ref: '#/components/schemas/OutingView'
        openIncidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
    HomeCard:
      type: object
      properties:
        id:
          type: string
        section:
          type: string
          enum:
          - CRITICAL
          - NEEDS_YOU
          - NOW
          - TODAY
          - FEED
        kind:
          type: string
        title:
          type: string
        subtitle:
          type: string
        count:
          type: integer
          format: int32
        severity:
          type: string
          enum:
          - INFO
          - ACTION
          - URGENT
          - CRITICAL
        dueAt:
          type: string
          format: date-time
        roleTag:
          type: string
        deepLink:
          type: string
        payload:
          type: object
          additionalProperties: true
      description: One home card; cards with nothing in them are not returned
      required:
