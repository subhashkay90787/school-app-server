          - FIRE_ALARM
          - POWER_CUT
          - MEDICAL
          - SUSPICIOUS_VEHICLE
          - GATE_BREACH
          - ANIMAL
          - THEFT
          - OTHER
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        occurredAt:
          type: string
          format: date-time
        locationId:
          type: integer
          format: int64
          description: -> inventory.location
        checkpointId:
          type: integer
          format: int64
          description: -> security.checkpoint
        description:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        rosterEntryId:
          type: integer
          format: int64
          description: -> hr.roster_entry
      required:
      - occurrenceType
      - severity
    OccurrencePage:
      type: object
      required:
      - items
      - page
      - size
      - total
