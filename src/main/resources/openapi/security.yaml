      - Security
      operationId: acceptHandover
      summary: Accept the handover
      parameters:
      - name: handoverId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftHandover'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
