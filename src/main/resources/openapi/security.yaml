      x-base-roles:
      - SECURITY
      x-operation-extra-annotation: '@com.school.app.core.access.Access(feature = "SECURITY")'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ExpectedMovement:
      type: object
      properties:
        kind:
          type: string
          enum:
          - OUTING_RETURN
          - TRAVEL_GROUP_DEPARTURE
          - VISITOR
          - VEHICLE
        title:
          type: string
        at:
          type: string
          format: date-time
        refId:
          type: integer
          format: int64
        count:
          type: integer
          format: int32
    GateMovementInput:
      type: object
      properties:
        outingId:
          type: integer
          format: int64
        direction:
          type: string
          enum:
          - OUT
          - IN
        verifiedPickupPersonId:
          type: integer
          format: int64
        verification:
          type: string
          enum:
          - QR
          - PARENT_OTP
          - PHOTO_ID
          - FACE
        parentOtp:
          type: string
        movedAt:
          type: string
          format: date-time
      required:
      - outingId
      - direction
      - verification
    GatePass:
      type: object
      description: Table frontoffice.gate_pass (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        gatePassId:
          type: integer
          format: int64
          readOnly: true
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        reason:
          type: string
        requestedByUserId:
          type: integer
          format: int64
          description: Auth user id
        approvedByUserId:
          type: integer
          format: int64
          description: Auth user id
        pickupPersonId:
          type: integer
          format: int64
          description: -> frontoffice.pickup_person
        verification:
          type: string
          enum:
          - PARENT_OTP
          - PHOTO_ID
        outAt:
          type: string
          format: date-time
        verifiedByUserId:
          type: integer
          format: int64
          description: Auth user id
      required:
      - gatePassId
      - studentId
    GateScanInput:
      type: object
      properties:
        code:
          type: string
        direction:
          type: string
          enum:
          - OUT
          - IN
      required:
      - code
    GateVerdict:
      type: object
      properties:
        verdict:
          type: string
          enum:
          - ALLOWED
          - STOP
          - UNVERIFIED
        reason:
          type: string
        student:
          $ref: '#/components/schemas/PersonRef'
        classSection:
          type: string
        passType:
          type: string
        outingId:
          type: integer
          format: int64
        gatePassId:
          type: integer
          format: int64
        pickupPerson:
          $ref: '#/components/schemas/PersonRef'
        requiresParentOtp:
          type: boolean
      description: Guards see name, photo, class and pass status only
    GroupOutInput:
      type: object
      properties:
        studentIds:
          type: array
          items:
            type: integer
            format: int64
        movedAt:
          type: string
          format: date-time
      required:
      - studentIds
    GuardHome:
      type: object
      properties:
        post:
          type: string
        shift:
          type: string
        onDutyFrom:
          type: string
          format: date-time
        onDutyTo:
          type: string
          format: date-time
        nextCheckpoint:
          type: string
        nextCheckpointDueAt:
          type: string
          format: date-time
        welfarePingDueAt:
          type: string
          format: date-time
        expected:
          type: array
          items:
            $ref: '#/components/schemas/ExpectedMovement'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/HomeCard'
    HomeCard:
      type: object
      properties:
        id:
          type: string
        section:
          type: string
          enum:
          - CRITICAL
          - NEEDS_YOU
          - NOW
          - TODAY
          - FEED
        kind:
          type: string
        title:
          type: string
        subtitle:
          type: string
        count:
          type: integer
          format: int32
        severity:
          type: string
          enum:
          - INFO
          - ACTION
          - URGENT
          - CRITICAL
        dueAt:
          type: string
          format: date-time
        roleTag:
          type: string
        deepLink:
          type: string
        payload:
          type: object
          additionalProperties: true
      description: One home card; cards with nothing in them are not returned
      required:
      - id
      - section
      - kind
      - title
    KeyIssueInput:
      type: object
      properties:
        issuedToUserId:
          type: integer
          format: int64
        dueBackAt:
          type: string
          format: date-time
      required:
      - issuedToUserId
    KeyMovement:
      type: object
      description: Table security.key_movement (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        keyMovementId:
          type: integer
          format: int64
          readOnly: true
        keyId:
          type: integer
          format: int64
          description: -> security.key
        issuedToUserId:
          type: integer
          format: int64
          description: Auth user id
        issuedByUserId:
          type: integer
          format: int64
          description: Auth user id
        issuedAt:
          type: string
          format: date-time
        dueBackAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
      required:
      - keyMovementId
      - keyId
      - issuedAt
    Occurrence:
      type: object
      description: Table security.occurrence (ER v5)
      properties:
        schoolId:
          type: integer
