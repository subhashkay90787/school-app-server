                $ref: '#/components/schemas/PlacementApplication'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      x-access:
        feature: PLACEMENTS
        anyOf:
        - ACADEMICS_SELF
      x-base-roles:
      - STUDENT
      x-operation-extra-annotation: '@com.school.app.core.access.Access(feature = "PLACEMENTS", anyOf = {"ACADEMICS_SELF"})'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
