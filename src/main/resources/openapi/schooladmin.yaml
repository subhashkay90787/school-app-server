components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from school-auth (OTP or social sign-in). Claims used: user_id, school_access[].{school_id,
        roles, base_roles, permissions, enabled_features}.'
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: true
      description: Branch to act in; must be in the token's school_access
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; repeats within 24 h return the first response (offline queues)
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 200
  responses:
    E400:
      description: Validation failed or the request breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 'No access: wrong role for this module, feature off for the branch, missing permission, or consent pending'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found in this branch (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: Conflicts with current state (e.g. already approved, ledger rule, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AcademicTerm:
      type: object
      description: Table academics.academic_term (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        termId:
          type: integer
          format: int64
          readOnly: true
        academicYearId:
          type: integer
          format: int64
          description: -> academics.academic_year
        termType:
          type: string
          enum:
          - TERM
          - SEMESTER
          - TRIMESTER
          - BATCH_CYCLE
        name:
          type: string
        sequence:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - termId
      - academicYearId
      - termType
      - name
    AcademicTermInput:
      type: object
      description: Create/update body for academics.academic_term
      properties:
        termType:
          type: string
          enum:
          - TERM
          - SEMESTER
          - TRIMESTER
          - BATCH_CYCLE
        name:
          type: string
        sequence:
          type: integer
          format: int32
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
      - termType
      - name
    AcademicYear:
      type: object
      description: Table academics.academic_year (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        academicYearId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
      required:
      - academicYearId
      - name
      - startDate
      - endDate
      - isCurrent
    AcademicYearInput:
      type: object
      description: Create/update body for academics.academic_year
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
      required:
      - name
      - startDate
      - endDate
    BulkResult:
      type: object
      properties:
        requested:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RowError'
    Certificate:
      type: object
      description: Table records.certificate (ER v5)
      properties:
        schoolId:
          type: integer
          format: int64
          readOnly: true
          description: Branch (auth school_id)
        certificateId:
          type: integer
          format: int64
          readOnly: true
        studentId:
          type: integer
          format: int64
          description: -> academics.student
        templateId:
          type: integer
          format: int64
          description: -> records.certificate_template
        serialNumber:
          type: string
        verificationCode:
          type: string
        reason:
          type: string
        issuedOn:
          type: string
          format: date
        issuedByUserId:
          type: integer
          format: int64
